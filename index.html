    .logo-dots { display: flex; gap: 3px; flex-wrap: wrap; width: 18px; }

<script>
const API_ENDPOINT='/api/chat';
const LANGS={
  en:{name:'English',bcp47:'en-US'},es:{name:'Espanol',bcp47:'es-ES'},
  fr:{name:'Francais',bcp47:'fr-FR'},de:{name:'Deutsch',bcp47:'de-DE'},
  ar:{name:'Arabic',bcp47:'ar-SA'},zh:{name:'Chinese',bcp47:'zh-CN'},
  hi:{name:'Hindi',bcp47:'hi-IN'},pt:{name:'Portugues',bcp47:'pt-BR'},
  ja:{name:'Japanese',bcp47:'ja-JP'}
};
const INTENTS={
  greeting:{kw:['hi','hello','hey','good morning'],color:'#10b981',icon:'&#128075;'},
  farewell:{kw:['bye','goodbye','thanks','exit'],color:'#8b5cf6',icon:'&#128079;'},
  refund:{kw:['refund','return','cancel','exchange'],color:'#ef4444',icon:'&#8617;&#65039;'},
  shipping:{kw:['track','delivery','shipping','package'],color:'#3b82f6',icon:'&#128230;'},
  billing:{kw:['pay','invoice','charge','bill','price'],color:'#f59e0b',icon:'&#128179;'},
  account:{kw:['login','password','account','reset'],color:'#14b8a6',icon:'&#128272;'},
  technical:{kw:['bug','error','crash','broken','issue'],color:'#ec4899',icon:'&#128295;'},
  product:{kw:['feature','how to','api','guide'],color:'#6366f1',icon:'&#128203;'},
  escalation:{kw:['human','agent','manager','escalate'],color:'#f97316',icon:'&#128100;'}
};
const FAQ=[
  {q:'How do I track my order?',a:'You can track your order on the **Order Tracking** page. You will also receive automatic email/SMS updates.',intent:'shipping'},
  {q:'What is your return policy?',a:'We offer a **30-day hassle-free return** policy. Refunds are processed within 5-7 business days.',intent:'refund'},
  {q:'How do I request a refund?',a:'Go to **My Orders**, select the order, then click **Request Return**.',intent:'refund'},
  {q:'What payment methods do you accept?',a:'We accept **Visa, Mastercard, Amex, PayPal, Apple Pay, Google Pay**.',intent:'billing'},
  {q:'How do I reset my password?',a:'Click **Forgot Password** on the login page. Check your spam folder if you do not see the reset link.',intent:'account'},
  {q:'How long does shipping take?',a:'Standard: 5-7 days\nExpress: 2-3 days\nOvernight: next day',intent:'shipping'},
  {q:'How do I contact a human agent?',a:'Our human support team is available:\n- **Live Chat**: 9am-6pm EST\n- **Phone**: 1-800-NOVA-AI\n- **Email**: support@novaai.com',intent:'escalation'},
  {q:'My app is not working',a:'Please try:\n1. Clear cache\n2. Disable extensions\n3. Try incognito mode\n\nContact tech support if issue persists.',intent:'technical'}
];

function classifyIntent(text){
  const lower=text.toLowerCase();let best='general',bestScore=0;
  for(const[name,cfg]of Object.entries(INTENTS)){
    const hits=cfg.kw.filter(k=>lower.includes(k)).length;
    if(hits>0){const s=hits/cfg.kw.length;if(s>bestScore){bestScore=s;best=name;}}
  }
  const conf=bestScore>0?Math.min(0.97,bestScore*9+(lower.split(' ').length>4?0.12:0.04)):0.28+Math.random()*0.12;
  return{intent:best,confidence:conf};
}

function searchFAQ(text){
  const words=text.toLowerCase().split(/\W+/).filter(w=>w.length>3);
  let best=null,bestScore=0;
  for(const entry of FAQ){
    const qw=entry.q.toLowerCase().split(/\W+/);
    const overlap=words.filter(w=>qw.some(q=>q.includes(w)||w.includes(q))).length;
    const score=overlap/Math.max(words.length,1);
    if(score>bestScore){bestScore=score;best=entry;}
  }
  return bestScore>=0.35?{entry:best,score:bestScore}:null;
}

let convs=JSON.parse(localStorage.getItem('nova_convs')||'[]');
let currentId=null,apiHistory=[],displayMsgs=[],lang='en',model='qwen/qwen3.8-27b';
let botName='NovaAI',ttsSpeed=1.0,confs=[],faqHits=0,msgTotal=0;
let isRecording=false,recog=null,msgSeq=0;
const msgTexts=new Map();

function sysPrompt(){
  return `You are ${botName}, a customer support AI for NovaAI.
RESPOND EXCLUSIVELY IN ${LANGS[lang].name}.
Be concise, professional, and clear.
Core knowledge: order tracking, 30-day returns, billing, accounts, basic tech support.
Never fabricate data like order IDs or ETAs.

CRITICAL INSTRUCTION: You must ALWAYS respond with a valid JSON object in this exact format:
{
  "reply": "Your actual response message here (use markdown)",
  "followups": ["Suggested question 1", "Suggested question 2", "Suggested question 3"]
}
Provide exactly 2-3 highly relevant follow-up questions the user might want to ask next based on your reply. Do NOT output any text outside of the JSON object.`;
}

function newChat(){
  currentId=Date.now().toString();apiHistory=[];displayMsgs=[];confs=[];faqHits=0;msgTotal=0;msgTexts.clear();
  clearMsgArea();updateStats();renderHist();
}

function loadConv(id){
  const c=convs.find(x=>x.id===id);if(!c)return;
  currentId=id;apiHistory=c.api||[];displayMsgs=c.display||[];confs=c.confs||[];faqHits=c.faqHits||0;msgTotal=c.msgTotal||0;
  clearMsgArea();
  displayMsgs.forEach(m=>appendBubble(m.role,m.text,m.intent,m.conf,false,m.followups||[]));
  updateStats();renderHist();scrollBot();
}

function saveConv(){
  const title=displayMsgs.find(m=>m.role==='user')?.text?.slice(0,52)||'New Chat';
  const rec={id:currentId,title,ts:Date.now(),api:apiHistory,display:displayMsgs,confs,faqHits,msgTotal};
  const idx=convs.findIndex(c=>c.id===currentId);
  if(idx>=0)convs[idx]=rec;else convs.unshift(rec);
  convs=convs.slice(0,25);localStorage.setItem('nova_convs',JSON.stringify(convs));renderHist();
}

function clearHistory(){
  if(!confirm('Clear all history?'))return;
  convs=[];localStorage.removeItem('nova_convs');newChat();
}

const msgsEl=()=>document.getElementById('msgs');
function clearMsgArea(){msgsEl().querySelectorAll('.msg-row,.typing').forEach(el=>el.remove());}
function scrollBot(){const m=msgsEl();m.scrollTop=m.scrollHeight;}

function md(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code style="background:#e2e8f0;padding:.1em .3em;border-radius:3px;font-family:monospace;font-size:0.9em">$1</code>')
    .replace(/\n/g,'<br>');
}

function appendBubble(role,text,intent,conf,animate=true,followups=[]){
  const id='m'+(++msgSeq);msgTexts.set(id,text);
  const row=document.createElement('div');
  row.className='msg-row '+role;
  if(!animate)row.style.animation='none';
  
  const av = role === 'assistant' ? '' : '<img src="https://i.pravatar.cc/150?u=adam" class="m-av" />';
  let acts = '';
  if (role === 'assistant') {
      acts = `<div class="msg-acts">
        <button class="m-act-btn" onclick="copyMsg('${id}')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Text</button>
        <button class="m-act-btn" onclick="sendMsg('Regenerate')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg> Regenerated Response</button>
        <button class="m-act-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg> Copy Link</button>
        <button class="m-act-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg> Share</button>
      </div>`;
  } else {
      acts = `<div class="msg-acts">
        <button class="m-act-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg> Save Question</button>
        <button class="m-act-btn" onclick="copyMsg('${id}')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Question</button>
        <button class="m-act-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Edit</button>
      </div>`;
  }
  
  row.innerHTML=`
    <div class="msg-box">
      <div class="msg-top">
        <div class="mt-left">
          ${av}
          <div class="m-icons" onclick="speakMsg('${id}')">
             <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
             <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </div>
        </div>
        <div class="m-time">2 Min ago</div>
      </div>
      <div>${md(text)}</div>
    </div>
    ${acts}
  `;
    
  msgsEl().appendChild(row);
  if(role==='assistant'){msgTotal++;confs.push(conf||0.5);updateStats();}
  scrollBot();return row;
}

function showTyping(){
  const el=document.createElement('div');el.className='typing';el.id='typing';
  el.innerHTML=`<div class="msg-row bot"><div class="msg-box">Thinking...</div></div>`;
  msgsEl().appendChild(el);scrollBot();
}
function hideTyping(){document.getElementById('typing')?.remove();}
function updateStats(){}

function renderHist(){
  const list=document.getElementById('hist-list');list.innerHTML='';
  convs.forEach(c=>{
    const div=document.createElement('div');div.className='h-item';
    div.onclick=()=>{loadConv(c.id); document.getElementById('chat-title').textContent = c.title;};
    div.innerHTML=`<div class="h-top"><div class="h-title">${esc(c.title)}</div><div class="h-time">${timeAgo(c.ts)}</div></div><div class="h-desc">${esc(c.title)} is a conversation...</div>`;
    list.appendChild(div);
  });
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function timeAgo(ts){
  const d=Date.now()-ts;
  if(d<60e3)return 'Just now';if(d<3600e3)return Math.floor(d/60e3)+'m ago';
  if(d<86400e3)return Math.floor(d/3600e3)+'h ago';return Math.floor(d/86400e3)+'d ago';
}

async function sendMsg(override){
  const inp=document.getElementById('inp');
  const text=(override!==undefined?override:inp.value).trim();if(!text)return;
  if(!currentId)newChat();
  inp.value='';setBusy(true);
  
  const{intent,confidence}=classifyIntent(text);
  appendBubble('user',text,null,null);
  displayMsgs.push({role:'user',text,intent,conf:confidence});
  apiHistory.push({role:'user',content:text});
  
  const faqRes=searchFAQ(text);
  let reply,replyConf,followups=[];
  showTyping();
  
  try{
    if(faqRes&&faqRes.score>0.55){
      await new Promise(r=>setTimeout(r,400));
      reply=faqRes.entry.a;replyConf=Math.min(0.98,faqRes.score+0.28);faqHits++;
      followups = ["Can I talk to a human?", "I have another question"];
    }else{
      const messages=[{role:'system',content:sysPrompt()},...apiHistory.slice(-12)];
      const res=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,model})});
      if(!res.ok)throw new Error(`API Error: ${res.status}`);
      const data=await res.json();
      if(data.error)throw new Error(data.error.message||'Unknown API Error');
      
      const rawText=data.choices?.[0]?.message?.content||'{}';
      try {
        const parsed = JSON.parse(rawText.replace(/```json/g,'').replace(/```/g,'').trim());
        reply = parsed.reply || rawText;
        followups = parsed.followups || [];
      } catch(e) {
        reply = rawText; // fallback if LLM doesn't output JSON
        followups = [];
      }
      replyConf=Math.min(0.95,confidence+0.18+Math.random()*0.09);
    }
    hideTyping();
    appendBubble('assistant',reply,intent,replyConf,true,followups);
    displayMsgs.push({role:'assistant',text:reply,intent,conf:replyConf,followups});
    apiHistory.push({role:'assistant',content:reply});
    saveConv();
  }catch(err){
    hideTyping();
    appendBubble('assistant','Connection error: '+err.message,'technical',0.25);
  }
  setBusy(false);
}

function quickSend(text){document.getElementById('inp').value=text;sendMsg(text);}
function setBusy(v){document.getElementById('send-btn').disabled=v;}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}

function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Voice not supported here.');return;}
  if(isRecording){recog?.stop();return;}
  recog=new SR();recog.lang=LANGS[lang].bcp47;recog.interimResults=true;
  const micBtn=document.getElementById('mic-btn');
  recog.onstart=()=>{
    isRecording=true;micBtn.style.stroke='#ef4444';
  };
  recog.onresult=e=>{
    document.getElementById('inp').value=Array.from(e.results).map(r=>r[0].transcript).join('');
  };
  recog.onend=()=>{
    isRecording=false;micBtn.style.stroke='#94a3b8';
    if(document.getElementById('inp').value.trim())sendMsg();
  };
  recog.start();
}

function speakMsg(id){
  if(!window.speechSynthesis)return;
  if(window.speechSynthesis.speaking)window.speechSynthesis.cancel();
  const rawText=(msgTexts.get(id)||'').replace(/[*_]/g,'').replace(/<[^>]+>/g,'');
  const utter=new SpeechSynthesisUtterance(rawText);
  utter.lang=LANGS[lang].bcp47;utter.rate=ttsSpeed;
  window.speechSynthesis.speak(utter);
}

function copyMsg(id){
  navigator.clipboard.writeText((msgTexts.get(id)||'').replace(/[*_]/g,''));
}

function init(){
  renderHist();newChat();
}
document.addEventListener('DOMContentLoaded',init);
</script>
